# 1. Conexión a la base de datos (valores por variables de entorno)
server.error.include-message=always
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lecto}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000

# 2. JPA / Hibernate: valida contra el esquema creado por Flyway, no lo modifica
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 3. JSON en snake_case, como acordó el equipo en modelo-datos.md
spring.jackson.property-naming-strategy=SNAKE_CASE

# 4. Puerto: Render lo inyecta en PORT; en local queda 8080
server.port=${PORT:8080}