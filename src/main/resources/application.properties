# 1. Configuración de la conexión usando variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lecto}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Validación del esquema (No crea ni modifica tablas automáticamente)
spring.jpa.hibernate.ddl-auto=validate

